---
# The smb role replaces smb.conf: shares and users not listed here are removed.
samba_share_root: /mnt/nas-data

samba_users:
  - name: atm10-backup
    password: "{{ backup_smb_password }}"

samba_shares:
  - name: backups
    comment: Machine backups (restic repositories, encrypted client-side)
    valid_users: ["atm10-backup"]
    browseable: false
