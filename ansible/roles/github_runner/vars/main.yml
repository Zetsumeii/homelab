---
github_runner_archive: "actions-runner-linux-x64-{{ github_runner_version }}.tar.gz"
github_runner_download_url: "https://github.com/actions/runner/releases/download/v{{ github_runner_version }}/{{ github_runner_archive }}"

github_runner_url_parts: "{{ github_runner_url | regex_replace('^https://github\\.com/', '') | regex_replace('/+$', '') | split('/') }}"
github_runner_is_org: "{{ github_runner_url_parts | length == 1 }}"
github_runner_token_api: >-
  https://api.github.com/{{ 'orgs/' ~ github_runner_url_parts[0]
  if github_runner_is_org | bool
  else 'repos/' ~ github_runner_url_parts | join('/') }}/actions/runners/registration-token

github_runner_registration_file: "{{ github_runner_dir }}/.runner"
github_runner_service: github-runner.service
