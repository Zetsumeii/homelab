---
- name: Fail early if the Prometheus basicauth credentials are not supplied
  ansible.builtin.assert:
    that:
      - prometheus_basicauth_users is defined
      - prometheus_basicauth_users | length > 0
    fail_msg: >-
      prometheus_basicauth_users is not set. Generate an htpasswd line
      (htpasswd -nB <user>) and store it in a vault-encrypted vars file.
      Prometheus has no authentication of its own, so Traefik provides it.

- name: Create monitoring directory
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/monitoring"
    state: directory
    mode: '0755'

- name: Copy compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ ansible_facts['user_dir'] }}/monitoring/docker-compose.yml"
    mode: '0644'

- name: Copy config files
  ansible.builtin.copy:
    src: infra
    dest: "{{ ansible_facts['user_dir'] }}/monitoring/"
    mode: '0644'
