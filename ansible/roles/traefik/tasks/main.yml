---
- name: Fail early if the ACME DNS token is not supplied
  ansible.builtin.assert:
    that:
      - traefik_acme_dns_token is defined
      - traefik_acme_dns_token | length > 0
    fail_msg: >-
      traefik_acme_dns_token is not set. Create a vault-encrypted vars file
      holding the DNS provider API token before running this role.

- name: Create traefik directory
  ansible.builtin.file:
    path: "{{ traefik_directory }}"
    state: directory
    mode: '0750'

- name: Create the shared proxy network
  community.docker.docker_network:
    name: "{{ traefik_network }}"
    driver: bridge
    ipam_config:
      - subnet: "{{ traefik_network_subnet }}"
        gateway: "{{ traefik_network_gateway }}"

- name: Install traefik static config
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: "{{ traefik_directory }}/traefik.yml"
    mode: '0640'
  notify: Restart traefik

- name: Install traefik dynamic config
  ansible.builtin.template:
    src: dynamic.yml.j2
    dest: "{{ traefik_directory }}/dynamic.yml"
    mode: '0640'

- name: Install traefik compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ traefik_directory }}/docker-compose.yml"
    # Contains the ACME DNS token via the environment block.
    mode: '0600'
  notify: Restart traefik

- name: Start traefik
  community.docker.docker_compose_v2:
    project_src: "{{ traefik_directory }}"
    state: present
