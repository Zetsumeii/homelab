---
- name: Create root user's .ssh directory
  become: true
  ansible.builtin.file:
    state: directory
    path: "{{ ansible_facts['user_dir'] }}/.ssh"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0700'

- name: Copy root user's authorized_keys
  become: true
  ansible.builtin.copy:
    src: root.pub
    dest: "{{ ansible_facts['user_dir'] }}/.ssh/authorized_keys"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'

- name: Create worker user's .ssh directory
  become: true
  ansible.builtin.file:
    state: directory
    path: "/home/{{ worker_username }}/.ssh"
    owner: "{{ worker_username }}"
    group: users
    mode: '0700'

- name: Copy worker user's authorized_keys
  become: true
  ansible.builtin.copy:
    src: worker.pub
    dest: "/home/{{ worker_username }}/.ssh/authorized_keys"
    owner: "{{ worker_username }}"
    group: users
    mode: '0600'

- name: Create root's .ssh directory
  become: true
  ansible.builtin.file:
    state: directory
    path: "/root/.ssh"
    owner: root
    group: root
    mode: '0700'

- name: Copy root's authorized_keys
  become: true
  ansible.builtin.copy:
    src: root.pub
    dest: "/root/.ssh/authorized_keys"
    owner: root
    group: root
    mode: '0600'
