---
- name: Authorize connecting user's key
  become: true
  ansible.posix.authorized_key:
    user: "{{ ansible_user }}"
    key: "{{ lookup('file', 'root.pub') }}"
    state: present
    manage_dir: true

- name: Authorize worker user's key
  become: true
  ansible.posix.authorized_key:
    user: "{{ worker_username }}"
    key: "{{ lookup('file', 'worker.pub') }}"
    state: present
    manage_dir: true

- name: Authorize root's key
  become: true
  ansible.posix.authorized_key:
    user: root
    key: "{{ lookup('file', 'root.pub') }}"
    state: present
    manage_dir: true
