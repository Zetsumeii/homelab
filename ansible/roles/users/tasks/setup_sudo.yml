---
- name: Setup sudo
  become: true
  ansible.builtin.apt:
    name: sudo
    state: present

- name: Create sudo-nopasswd group
  become: true
  ansible.builtin.group:
    name: sudo-nopasswd
    state: present

- name: Setup sudo-nopasswd
  become: true
  ansible.builtin.copy:
    dest: /etc/sudoers.d/sudo-nopasswd
    content: "%sudo-nopasswd ALL=(ALL:ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s
